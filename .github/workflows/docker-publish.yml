name: Publish Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string
      sha:
        description: Released commit SHA
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string
      update_latest:
        description: Also move latest to this release (only select for the newest release)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate release tag and Docker configuration
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a stable vX.Y.Z release tag"; exit 1; }
          [[ -n "$IMAGE" && -n "$USERNAME" && -n "$TOKEN" ]] || { echo "::error::Configure DOCKERHUB_IMAGE, DOCKERHUB_USERNAME and DOCKERHUB_TOKEN"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          persist-credentials: false
      - name: Match image version to package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$version" == "$package_version" ]] || { echo "::error::Release tag and package version differ"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.value }}
            ${{ (inputs.sha != '' || inputs.update_latest) && format('{0}:latest', vars.DOCKERHUB_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
