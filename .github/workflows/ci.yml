name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check automation formatting
        run: pnpm exec prettier '.github/workflows/*.yml' release-please-config.json .release-please-manifest.json --check
      - run: pnpm astro check
      - run: pnpm test:coverage
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:regression
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Build production container
        run: docker build --tag carfdev-web:ci .
      - name: Test production nginx runtime
        env:
          NGINX_TEST_URL: http://127.0.0.1:8080
        run: |
          container_id=$(docker run --rm --detach --publish 127.0.0.1:8080:8080 carfdev-web:ci)
          trap 'docker logs "$container_id" || true; docker stop "$container_id" >/dev/null' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 5 "$NGINX_TEST_URL/" >/dev/null
          node --test tests/nginx.test.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
